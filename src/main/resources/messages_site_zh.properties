site.meta.desc.home=青岛云合智能制造（QINGDAO YUNHE）专注高速喷水织机与喷气织机研发制造，覆盖重磅、高速与喷气系列，服务全球织造工厂。查看机型、工厂实景与全球案例。
site.meta.desc.about=青岛云合智能制造有限公司（QINGDAO YUNHE）：研发、机加工、装配、检测、出口一体化链。中国青岛喷水织机与喷气织机专业制造商。
site.meta.desc.values=云合价值观：可靠、精密、长期服务，贯穿每一台喷水织机与喷气织机的设计、制造与售后，践行长期伙伴合作。
site.meta.desc.contact=联系青岛云合智能制造：获取喷水织机与喷气织机报价、技术咨询与售后支持。地址位于中国青岛（Wangtai），支持全球出口。
site.meta.desc.references=云合喷水织机与喷气织机在印度、孟加拉等市场的真实装机案例：不同织物、机型与开口配置的织造应用参考。
site.meta.desc.product.yh608=YH608 高速重磅喷水织机（Water Jet Loom）：高克重、重磅织物专用，稳定高效。青岛云合制造，支持全球出口与定制。
site.meta.desc.product.yh822=YH822 高速喷水织机（High-Speed Water Jet Loom）：高速高产、节能稳定，适配化纤长丝织物大批量织造。青岛云合制造。
site.meta.desc.product.yh9100=YH9100 喷气织机（Air Jet Loom）：高速喷气织造，适配棉、混纺短纤纱织物。青岛云合智能制造出品，支持全球装机服务。

