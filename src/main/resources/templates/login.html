<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>登录 - YUNHE 管理后台</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body class="login-page">
<div class="login-card">
    <div class="brand">
        <span class="logo">Y</span>
        <span class="brand-name">YUNHE 管理后台</span>
    </div>
    <div class="login-subtitle">请使用您的账号登录</div>

    <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误，或账号已禁用</div>
    <div th:if="${param.logout}" class="alert alert-success">您已安全退出</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="请输入用户名" autocomplete="username" required autofocus/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">密码</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="请输入密码" autocomplete="current-password" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">登 录</button>
    </form>
</div>

<script src="/js/three.r134.min.js"></script>
<script src="/js/vanta.clouds2.min.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
