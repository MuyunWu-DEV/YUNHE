<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>登录 - YUNHE 管理后台</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body class="login-page">
<div class="login-card">
    <div class="brand">
        <span class="logo">Y</span>
        <span class="brand-name">YUNHE 管理后台</span>
    </div>
    <div class="login-subtitle">请使用您的账号登录</div>

    <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误，或账号已禁用</div>
    <div th:if="${param.logout}" class="alert alert-success">您已安全退出</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">用户名</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="请输入用户名" autocomplete="username" required autofocus/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">密码</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="请输入密码" autocomplete="current-password" required/>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">登 录</button>
    </form>
</div>

<script src="/js/three.r134.min.js"></script>
<script src="/js/vanta.clouds2.min.js"></script>
<script>
(function () {
    function fail(msg) {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:9999;background:#dc2626;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.3)';
        d.textContent = 'Vanta 加载失败：' + msg;
        document.body.appendChild(d);
    }
    function startClouds() {
        try {
            if (typeof THREE === 'undefined') return fail('three.js 未加载');
            if (!window.VANTA || typeof VANTA.CLOUDS2 !== 'function') return fail('VANTA.CLOUDS2 未定义');
            VANTA.CLOUDS2({
                el: '.login-page',
                THREE: THREE,
                texturePath: '/images/noise.png',
                backgroundColor: 0x6fb9ef,
                skyColor: 0x7fc9ff,
                cloudColor: 0x4f7fc4,
                lightColor: 0xffffff,
                speed: 1.0,
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00
            });
        } catch (e) {
            fail(e && e.message ? e.message : String(e));
        }
    }
    if (document.readyState === 'complete') {
        startClouds();
    } else {
        window.addEventListener('load', startClouds);
    }
})();
</script>
</body>
</html>
