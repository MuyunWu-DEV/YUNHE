<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <!-- SEO：错误页不进入索引 -->
    <meta name="robots" content="noindex, nofollow"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>出错了</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f6fb;">
<div class="text-center">
    <h1 style="font-size:64px;font-weight:700;color:#dc2626;"
        th:text="${status != null ? status : '!'}">!</h1>
    <p class="text-muted mb-4" th:text="${message != null ? message : '系统开小差了，请稍后重试'}">出错了</p>
    <a th:href="@{/admin/dashboard}" class="btn btn-primary">返回首页</a>
</div>
</body>
</html>
