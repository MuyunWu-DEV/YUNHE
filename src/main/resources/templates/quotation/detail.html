<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('报价单详情')}"></head>
<body th:replace="~{fragments/layout :: layout('报价单详情', ~{::content})}">
<div th:fragment="content">
    <div th:replace="~{fragments/chain :: chainPanel(${chain}, 'quotation')}"></div>

    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>报价单详情</h5>
            <div class="d-flex gap-2">
                <form sec:authorize="hasAuthority('quotation:update')"
                      th:action="@{/crm/quotations/{id}/send(id=${quotation.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-secondary" title="下载报价单">
                        <i class="bi bi-download"></i> 下载报价单</button>
                </form>
                <a th:if="${quotation.status.name() == 'CONFIRMED'}"
                   sec:authorize="hasAuthority('quotation:update')"
                   th:href="@{/crm/quotations/{id}/revise(id=${quotation.id})}"
                   class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-arrow-repeat"></i> 发起变更</a>
                <a th:href="@{/crm/quotations}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-2">报价单 ID</dt>
                <dd class="col-sm-4" th:text="${quotation.id}">1</dd>
                <dt class="col-sm-2">报价日期</dt>
                <dd class="col-sm-4" th:text="${quotation.quoteDate}">2026-01-01</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">客户</dt>
                <dd class="col-sm-4"
                    th:text="${quotation.customer != null ? quotation.customer.name + (!#strings.isEmpty(quotation.customer.company) ? ' (' + quotation.customer.company + ')' : '') : '-'}">客户</dd>
                <dt class="col-sm-2">状态</dt>
                <dd class="col-sm-4">
                    <span class="badge badge-soft"
                          th:classappend="${quotation.status.name() == 'CONFIRMED'} ? 'badge-success' : (${quotation.status.name() == 'SENT'} ? 'badge-info' : 'badge-muted')"
                          th:text="#{${quotation.status.code}}">草稿</span>
                </dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">备注</dt>
                <dd class="col-sm-10" th:text="${quotation.remark} ?: '-'">-</dd>
            </dl>

            <h6 class="mb-3">明细</h6>
            <div class="table-responsive" th:if="${quotation.details != null and !quotation.details.isEmpty()}">
                <table class="table">
                    <thead>
                    <tr>
                        <th style="width:180px">品名</th>
                        <th style="width:120px">HS Code</th>
                        <th>货物描述</th>
                        <th style="width:120px">单价</th>
                        <th style="width:120px">数量</th>
                        <th style="width:140px">小计</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="group : ${quotation.details}">
                        <tr th:each="item, iterStat : ${group.items()}">
                            <td th:if="${iterStat.first}" th:text="${group.name()}" th:rowspan="${group.items().size()}">品名</td>
                            <td th:if="${iterStat.first}" th:text="${group.hsCode()} ?: '-'" th:rowspan="${group.items().size()}">HS Code</td>
                            <td th:text="${item.description()}">描述</td>
                            <td th:text="${item.unitPrice() != null ? T(com.yunhe.website.crm.support.FormatUtil).money(item.unitPrice()) + (item.currency() != null ? ' ' + item.currency() : '') : '-'}">单价</td>
                            <td th:text="${item.quantity() != null ? item.quantity() + (item.unit() != null ? ' ' + item.unit() : '') : '-'}">数量</td>
                            <td th:text="${item.subtotal() != null ? T(com.yunhe.website.crm.support.FormatUtil).money(item.subtotal()) + (item.currency() != null ? ' ' + item.currency() : '') : '-'}">小计</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div th:if="${quotation.details == null or quotation.details.isEmpty()}" class="empty-state">暂无明细</div>
        </div>
    </div>

    <div class="card mt-4" style="max-width: 1440px;">
        <div class="card-header"><h5>变更历史</h5></div>
        <div class="card-body">
            <table class="table" th:if="${logs != null and !logs.isEmpty()}">
                <thead>
                <tr>
                    <th style="width:160px">变更时间</th>
                    <th style="width:140px">操作人</th>
                    <th>变更原因</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${logs}">
                    <td th:text="${#temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
                    <td th:text="${log.changedBy} ?: '-'">admin</td>
                    <td th:text="${log.changeReason}">变更原因</td>
                </tr>
                </tbody>
            </table>
            <div th:if="${logs == null or logs.isEmpty()}" class="empty-state">暂无变更记录</div>
        </div>
    </div>
</div>
</body>
</html>
