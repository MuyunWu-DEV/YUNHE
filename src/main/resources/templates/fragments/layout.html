<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' - YUNHE 管理后台'">YUNHE 管理后台</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link th:href="@{/css/admin.css}" rel="stylesheet"/>
</head>
<body th:fragment="layout(title, content)">
<div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="logo">Y</span>
            <span class="brand-name">YUNHE 后台</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">导航</div>

            <a class="nav-link" th:href="@{/admin/dashboard}"
               th:classappend="${#strings.startsWith(currentUri, '/admin/dashboard')} ? 'active'">
                <i class="bi bi-grid-1x2-fill"></i>仪表盘</a>

            <div class="menu-group">
                <button class="menu-group-title" type="button" aria-expanded="false">
                    <i class="bi bi-globe2"></i>
                    <span>Foreign Trade Service</span>
                    <i class="bi bi-chevron-down menu-group-arrow"></i>
                </button>
                <div class="menu-group-body">
                    <div class="menu-group-inner">
                        <a class="nav-link" th:href="@{/crm/quotations}" sec:authorize="hasAuthority('quotation:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/quotations')} ? 'active'">
                            <i class="bi bi-receipt"></i>报价管理</a>

                        <a class="nav-link" th:href="@{/crm/proforma-invoices}" sec:authorize="hasAuthority('proforma-invoice:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/proforma-invoices')} ? 'active'">
                            <i class="bi bi-file-earmark-text"></i>Proforma Invoice</a>

                        <a class="nav-link" th:href="@{/crm/sales-orders}" sec:authorize="hasAuthority('sales-order:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/sales-orders')} ? 'active'">
                            <i class="bi bi-cart3"></i>订单管理</a>

                        <a class="nav-link" th:href="@{/crm/commercial-invoices}" sec:authorize="hasAuthority('commercial-invoice:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/commercial-invoices')} ? 'active'">
                            <i class="bi bi-receipt-cutoff"></i>商业发票</a>

                        <a class="nav-link" th:href="@{/crm/packing-lists}" sec:authorize="hasAuthority('packing-list:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/packing-lists')} ? 'active'">
                            <i class="bi bi-box-seam"></i>装箱单</a>
                    </div>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-group-title" type="button" aria-expanded="false">
                    <i class="bi bi-person-gear"></i>
                    <span>User Permission Service</span>
                    <i class="bi bi-chevron-down menu-group-arrow"></i>
                </button>
                <div class="menu-group-body">
                    <div class="menu-group-inner">
                        <a class="nav-link" th:href="@{/admin/users}" sec:authorize="hasAuthority('user:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/admin/users')} ? 'active'">
                            <i class="bi bi-people-fill"></i>用户管理</a>

                        <a class="nav-link" th:href="@{/admin/roles}" sec:authorize="hasAuthority('role:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/admin/roles')} ? 'active'">
                            <i class="bi bi-shield-lock-fill"></i>角色管理</a>

                        <a class="nav-link" th:href="@{/admin/permissions}" sec:authorize="hasAuthority('permission:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/admin/permissions')} ? 'active'">
                            <i class="bi bi-key-fill"></i>权限管理</a>
                    </div>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-group-title" type="button" aria-expanded="false">
                    <i class="bi bi-people"></i>
                    <span>Customer Service</span>
                    <i class="bi bi-chevron-down menu-group-arrow"></i>
                </button>
                <div class="menu-group-body">
                    <div class="menu-group-inner">
                        <a class="nav-link" th:href="@{/crm/customers}" sec:authorize="hasAuthority('customer:list')"
                           th:classappend="${#strings.startsWith(currentUri, '/crm/customers')} ? 'active'">
                            <i class="bi bi-person-vcard"></i>客户档案</a>
                    </div>
                </div>
            </div>

            <div class="menu-group">
                <button class="menu-group-title" type="button" aria-expanded="false">
                    <i class="bi bi-gear"></i>
                    <span>System Management</span>
                    <i class="bi bi-chevron-down menu-group-arrow"></i>
                </button>
                <div class="menu-group-body">
                    <div class="menu-group-inner">
                        <a class="nav-link" th:href="@{/system/settings/edit}" sec:authorize="hasAuthority('system:settings:update')"
                           th:classappend="${#strings.startsWith(currentUri, '/system/settings')} ? 'active'">
                            <i class="bi bi-sliders"></i>系统设置</a>
                    </div>
                </div>
            </div>
        </nav>
        <div class="sidebar-footer">YUNHE © 2026</div>
    </aside>

    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 主区域 -->
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开菜单">
                    <i class="bi bi-list"></i>
                </button>
                <div class="page-title" th:text="${title}">页面</div>
            </div>

            <div class="user-menu">
                <a class="btn btn-sm btn-outline-secondary" title="语言 / Language"
                   th:href="${#locale.language == 'en'} ? '?lang=zh' : '?lang=en'">
                    <i class="bi bi-translate"></i>
                    <span th:text="${#locale.language == 'en'} ? '中文' : 'English'">English</span>
                </a>
                <div class="avatar"
                     th:text="${#strings.substring(#authentication.principal.displayName, 0, 1)}">A</div>
                <span class="user-name hide-sm" th:text="${#authentication.principal.displayName}">用户</span>
                <a th:href="@{/admin/profile/password}" class="btn btn-sm btn-outline-secondary"
                   title="修改密码">
                    <i class="bi bi-key"></i><span class="hide-sm"> 修改密码</span>
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger" title="退出登录">
                        <i class="bi bi-box-arrow-right"></i><span class="hide-sm"> 退出</span>
                    </button>
                </form>
            </div>
        </header>

        <main class="content">
            <div th:if="${successMessage}" class="alert alert-success flash-alert" th:text="${successMessage}"></div>
            <div th:if="${infoMessage}" class="alert alert-info flash-alert" th:text="${infoMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger flash-alert" th:text="${errorMessage}"></div>

            <div th:replace="${content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
