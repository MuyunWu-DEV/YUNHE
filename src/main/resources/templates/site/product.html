<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{site/layout :: head(title=${pageTitle})}"></head>
<body th:replace="~{site/layout :: body(title=${pageTitle}, content=~{::content})}">
<div th:fragment="content">

    <!-- ===== 详情 Hero · 模型名 + tagline ===== -->
    <section class="section dhero">
        <div class="dhero-inner">
            <h2 th:text="#{${prefix + 'name'}}">YH608 高速重磅喷水织机</h2>
            <p class="lede" th:text="#{${prefix + 'tagline'}}">为重磅织物而生的高速生产专家</p>
        </div>
    </section>

    <!-- ===== 大幅产品图区 · 全宽横幅（按 modelId 切换真机大图；CSS 在 .dhero-img-yh{608,822,9100}） ===== -->
    <section class="dhero-img" th:classappend="${'dhero-img-' + modelId}" aria-label="machine photo">
        <span class="dhero-img-cap" th:text="#{${prefix + 'name'}}">YH608</span>
    </section>

    <!-- ===== 关键规格条 · 4 项 ===== -->
    <section class="dspecs">
        <div class="dspecs-inner">
            <div class="dspec" th:each="i : ${#numbers.sequence(1,4)}">
                <div class="dspec-v" th:text="#{${prefix + 'spec' + i + '.value'}}">2300 m/min</div>
                <div class="dspec-l" th:text="#{${prefix + 'spec' + i + '.label'}}">入纬率</div>
            </div>
        </div>
    </section>

    <!-- ===== 技术参数表 · 11 行 ===== -->
    <section class="section dtable">
        <h2>技术参数</h2>
        <table class="dtable-t">
            <tbody>
            <tr th:each="i : ${#numbers.sequence(1,11)}"
                th:if="${not #strings.isEmpty(#messages.msgOrNull(prefix + 'table' + i + '.label'))}">
                <td class="dtable-l" th:text="#{${prefix + 'table' + i + '.label'}}">项目</td>
                <td class="dtable-v" th:text="#{${prefix + 'table' + i + '.value'}}">参数</td>
            </tr>
            </tbody>
        </table>
    </section>

    <!-- ===== 核心特性网格 · 6 项（图标 + 标题 + 描述） ===== -->
    <section class="section dfeat">
        <div class="dfeat-grid">
            <div class="dfeat-item" th:each="icon, iter : ${featureIcons}">
                <div class="dfeat-icon" th:text="${icon}">⚡</div>
                <h3 th:text="#{${prefix + 'feature' + iter.count + '.title'}}">高速入纬</h3>
                <p th:text="#{${prefix + 'feature' + iter.count + '.desc'}}">描述</p>
            </div>
        </div>
    </section>

    <!-- ===== 询价 CTA ===== -->
    <section class="dcta">
        <h2 th:text="#{${prefix + 'ctaTitle'}}">了解详细参数与价格</h2>
        <p th:text="#{${prefix + 'ctaLede'}}">我们的销售工程师将在 24 小时内为您定制方案。</p>
        <div class="dcta-actions">
            <a href="https://wa.me/8619857147744" class="btn btn-light">WhatsApp</a>
            <a href="mailto:wmy440724@gmail.com" class="btn btn-outline-white">发送邮件</a>
        </div>
    </section>

</div>
</body>
</html>
