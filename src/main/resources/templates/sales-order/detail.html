<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('订单详情')}"></head>
<body th:replace="~{fragments/layout :: layout('订单详情', ~{::content})}">
<div th:fragment="content">
    <div th:if="${chain != null}"
         th:replace="~{fragments/chain :: chainPanel(${chain}, 'salesOrder')}"></div>

    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>订单详情</h5>
            <div class="d-flex gap-2">
                <a sec:authorize="hasAuthority('sales-order:update')"
                   th:href="@{/crm/sales-orders/{id}/edit(id=${order.id})}"
                   class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i> 编辑</a>
                <a th:href="@{/crm/sales-orders}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-2">订单号</dt>
                <dd class="col-sm-4" th:text="${order.orderNo}">YHSO-2026-001</dd>
                <dt class="col-sm-2">订单日期</dt>
                <dd class="col-sm-4" th:text="${order.orderDate}">2026-01-01</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">客户</dt>
                <dd class="col-sm-4"
                    th:text="${order.customer != null ? order.customer.name + (!#strings.isEmpty(order.customer.company) ? ' (' + order.customer.company + ')' : '') : '-'}">客户</dd>
                <dt class="col-sm-2">状态</dt>
                <dd class="col-sm-4">
                    <span class="badge badge-soft"
                          th:classappend="${order.status.name() == 'SHIPPED'} ? 'badge-success' : (${order.status.name() == 'CONFIRMED'} ? 'badge-info' : 'badge-muted')"
                          th:text="#{${order.status.code}}">草稿</span>
                </dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">备注</dt>
                <dd class="col-sm-10" th:text="${order.remark} ?: '-'">-</dd>
            </dl>

            <h6 class="mb-3">货物明细</h6>
            <div class="table-responsive" th:if="${order.details != null and !order.details.isEmpty()}">
                <table class="table">
                    <thead>
                    <tr>
                        <th style="width:180px">品名</th>
                        <th style="width:120px">HS Code</th>
                        <th>货物描述</th>
                        <th style="width:120px">单价</th>
                        <th style="width:80px">数量</th>
                        <th style="width:80px">单位</th>
                        <th style="width:140px">小计</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="group : ${order.details}">
                        <tr th:each="item, iterStat : ${group.items()}">
                            <td th:if="${iterStat.first}" th:text="${group.name()}" th:rowspan="${group.items().size()}">品名</td>
                            <td th:if="${iterStat.first}" th:text="${group.hsCode()} ?: '-'" th:rowspan="${group.items().size()}">HS Code</td>
                            <td th:text="${item.description()}">描述</td>
                            <td th:text="${item.unitPrice()} ?: '-'">单价</td>
                            <td th:text="${item.quantity()}">数量</td>
                            <td th:text="${item.unit()} ?: '-'">单位</td>
                            <td th:text="${item.subtotal()}">小计</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div th:if="${order.details == null or order.details.isEmpty()}" class="empty-state">暂无明细</div>
        </div>
    </div>
</div>
</body>
</html>
