<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('形式发票详情')}"></head>
<body th:replace="~{fragments/layout :: layout('形式发票详情', ~{::content})}">
<div th:fragment="content">
    <div th:if="${chain != null}"
         th:replace="~{fragments/chain :: chainPanel(${chain}, 'proformaInvoice')}"></div>

    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>形式发票详情</h5>
            <div class="d-flex gap-2">
                <form th:if="${invoice.status.name() != 'GENERATED'}" sec:authorize="hasAuthority('proforma-invoice:update')"
                      th:action="@{/crm/proforma-invoices/{id}/generate(id=${invoice.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-file-earmark-arrow-down"></i>
                        <span th:text="${invoice.status.name() == 'PENDING_REGENERATION'} ? '重新生成' : '生成 PDF'">生成 PDF</span></button>
                </form>
                <a th:if="${invoice.status.name() == 'PENDING_GENERATION'}"
                   sec:authorize="hasAuthority('proforma-invoice:update')"
                   th:href="@{/crm/proforma-invoices/{id}/edit(id=${invoice.id})}"
                   class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i> 编辑</a>
                <a th:if="${invoice.status.name() == 'GENERATED'}"
                   sec:authorize="hasAuthority('proforma-invoice:update')"
                   th:href="@{/crm/proforma-invoices/{id}/revise(id=${invoice.id})}"
                   class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-arrow-repeat"></i> 发起变更</a>
                <form th:if="${invoice.status.name() == 'GENERATED' and chain != null and chain.salesOrder == null}"
                      sec:authorize="hasAuthority('sales-order:create')"
                      th:action="@{/crm/sales-orders/convert(piId=${invoice.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-success">
                        <i class="bi bi-cart-plus"></i> 转订单</button>
                </form>

                <form th:if="${invoice.status.name() == 'GENERATED' and chain != null and chain.commercialInvoice == null}"
                      sec:authorize="hasAuthority('commercial-invoice:create')"
                      th:action="@{/crm/commercial-invoices/generate(piId=${invoice.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-receipt-cutoff"></i> 创建 Commercial Invoice</button>
                </form>

                <form th:if="${invoice.status.name() == 'GENERATED' and chain != null and chain.packingList == null}"
                      sec:authorize="hasAuthority('packing-list:create')"
                      th:action="@{/crm/packing-lists/generate(piId=${invoice.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-box-seam"></i> 创建 Packing List</button>
                </form>

                <a th:href="@{/crm/proforma-invoices}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-2">发票号</dt>
                <dd class="col-sm-4" th:text="${invoice.invoiceNumber}">YHPI-2026-001</dd>
                <dt class="col-sm-2">发票日期</dt>
                <dd class="col-sm-4" th:text="${invoice.invoiceDate}">2026-01-01</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">状态</dt>
                <dd class="col-sm-10">
                    <span class="badge badge-soft"
                          th:classappend="${invoice.status.name() == 'GENERATED'} ? 'badge-success' : (${invoice.status.name() == 'PENDING_REGENERATION'} ? 'badge-warning' : 'badge-muted')"
                          th:text="#{${invoice.status.code}}">待生成</span>
                </dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">客户</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.customer != null ? invoice.customer.name + (!#strings.isEmpty(invoice.customer.company) ? ' (' + invoice.customer.company + ')' : '') : '-'}">客户</dd>
                <dt class="col-sm-2">来源报价单</dt>
                <dd class="col-sm-4" th:text="${invoice.quotationId} ?: '-'">-</dd>
            </dl>

            <h6 class="mb-2">Seller（卖方）</h6>
            <div class="mb-4" style="white-space: pre-line;"
                 th:text="${invoice.details != null ? invoice.details.seller() : '-'}">-</div>

            <h6 class="mb-2">Buyer（买方）</h6>
            <dl class="row mb-3">
                <dt class="col-sm-2">公司名</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.details != null and invoice.details.buyer() != null ? invoice.details.buyer().companyName() : '-'}">-</dd>
                <dt class="col-sm-2">注册号</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.details != null and invoice.details.buyer() != null ? invoice.details.buyer().registrationNo() : '-'}">-</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">地址</dt>
                <dd class="col-sm-10" style="white-space: pre-line;"
                    th:text="${invoice.details != null and invoice.details.buyer() != null ? invoice.details.buyer().address() : '-'}">-</dd>
            </dl>

            <h6 class="mb-2 mt-4">Incoterms（贸易条款）</h6>
            <div class="mb-4" th:text="${invoice.details != null ? invoice.details.incoterms() : '-'}">-</div>

            <h6 class="mb-2">Terms（条款）</h6>
            <div class="mb-4" style="white-space: pre-line;"
                 th:text="${invoice.details != null ? invoice.details.terms() : '-'}">-</div>

            <h6 class="mb-2">Bank Account Information（银行账户信息）</h6>
            <div style="white-space: pre-line;"
                 th:text="${invoice.details != null ? invoice.details.bankAccountInformation() : '-'}">-</div>

            <h6 class="mb-2 mt-4">版本历史</h6>
            <table class="table" th:if="${versions != null and !versions.isEmpty()}">
                <thead>
                <tr>
                    <th style="width:100px">版本号</th>
                    <th style="width:180px">生成时间</th>
                    <th>改动说明</th>
                    <th style="width:220px">下载</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${versions}">
                    <td th:text="'v' + ${v.versionNo}">v1</td>
                    <td th:text="${#temporals.format(v.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</td>
                    <td th:text="${v.log} ?: '-'">Automatically generated</td>
                    <td>
                        <a th:href="@{/crm/proforma-invoices/{id}/versions/{versionId}/download(id=${invoice.id}, versionId=${v.id})}"
                           th:text="|${invoice.invoiceNumber}-v${v.versionNo}.pdf|">YHPI-2026-001-v1.pdf</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${versions == null or versions.isEmpty()}" class="empty-state">暂无版本</div>
        </div>
    </div>
</div>
</body>
</html>
