<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('商业发票详情')}"></head>
<body th:replace="~{fragments/layout :: layout('商业发票详情', ~{::content})}">
<div th:fragment="content">
    <div th:if="${chain != null}"
         th:replace="~{fragments/chain :: chainPanel(${chain}, 'commercialInvoice')}"></div>

    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>商业发票详情</h5>
            <div class="d-flex gap-2">
                <form th:if="${invoice.status.name() != 'GENERATED'}" sec:authorize="hasAuthority('commercial-invoice:update')"
                      th:action="@{/crm/commercial-invoices/{id}/generate(id=${invoice.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-file-earmark-arrow-down"></i>
                        <span th:text="${invoice.status.name() == 'PENDING_REGENERATION'} ? '重新生成' : '生成 PDF'">生成 PDF</span></button>
                </form>
                <a th:if="${invoice.status.name() == 'PENDING_GENERATION'}"
                   sec:authorize="hasAuthority('commercial-invoice:update')"
                   th:href="@{/crm/commercial-invoices/{id}/edit(id=${invoice.id})}"
                   class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i> 编辑</a>
                <a th:if="${invoice.status.name() == 'GENERATED'}"
                   sec:authorize="hasAuthority('commercial-invoice:update')"
                   th:href="@{/crm/commercial-invoices/{id}/revise(id=${invoice.id})}"
                   class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-arrow-repeat"></i> 发起变更</a>
                <a th:href="@{/crm/commercial-invoices}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-2">发票号</dt>
                <dd class="col-sm-4" th:text="${invoice.invoiceNo}">YHINV-2026-001</dd>
                <dt class="col-sm-2">发票日期</dt>
                <dd class="col-sm-4" th:text="${invoice.invoiceDate}">2026-01-01</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">状态</dt>
                <dd class="col-sm-10">
                    <span class="badge badge-soft"
                          th:classappend="${invoice.status.name() == 'GENERATED'} ? 'badge-success' : (${invoice.status.name() == 'PENDING_REGENERATION'} ? 'badge-warning' : 'badge-muted')"
                          th:text="#{${invoice.status.code}}">待生成</span>
                </dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">客户</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.customer != null ? invoice.customer.name + (!#strings.isEmpty(invoice.customer.company) ? ' (' + invoice.customer.company + ')' : '') : '-'}">客户</dd>
                <dt class="col-sm-2">备注</dt>
                <dd class="col-sm-4" th:text="${invoice.remark} ?: '-'">-</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">定金比例</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.depositPercentage != null ? invoice.depositPercentage.stripTrailingZeros().toPlainString() + '%' : '-'}">-</dd>
                <dt class="col-sm-2">尾款比例</dt>
                <dd class="col-sm-4"
                    th:text="${invoice.balancePercentage() != null ? invoice.balancePercentage().stripTrailingZeros().toPlainString() + '%' : '-'}">-</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">定金付款方式</dt>
                <dd class="col-sm-4" th:text="${invoice.depositPaymentMethod} ?: '-'">-</dd>
                <dt class="col-sm-2">尾款付款方式</dt>
                <dd class="col-sm-4" th:text="${invoice.balancePaymentMethod} ?: '-'">-</dd>
            </dl>

            <h6 class="mb-3">货物明细</h6>
            <div class="table-responsive" th:if="${chain != null and chain.quotation != null and chain.quotation.details != null and !chain.quotation.details.isEmpty()}">
                <table class="table">
                    <thead>
                    <tr>
                        <th style="width:180px">品名</th>
                        <th style="width:120px">HS Code</th>
                        <th>货物描述</th>
                        <th style="width:120px">单价</th>
                        <th style="width:80px">数量</th>
                        <th style="width:80px">单位</th>
                        <th style="width:140px">小计</th>
                    </tr>
                    </thead>
                    <tbody>
                    <th:block th:each="group : ${chain.quotation.details}">
                        <tr th:each="item, iterStat : ${group.items()}">
                            <td th:if="${iterStat.first}" th:text="${group.name()}" th:rowspan="${group.items().size()}">品名</td>
                            <td th:if="${iterStat.first}" th:text="${group.hsCode()} ?: '-'" th:rowspan="${group.items().size()}">HS Code</td>
                            <td th:text="${item.description()}">描述</td>
                            <td th:text="${item.unitPrice()} ?: '-'">单价</td>
                            <td th:text="${item.quantity()}">数量</td>
                            <td th:text="${item.unit()} ?: '-'">单位</td>
                            <td th:text="${item.subtotal()}">小计</td>
                        </tr>
                    </th:block>
                    </tbody>
                </table>
            </div>
            <div th:if="${chain == null or chain.quotation == null or chain.quotation.details == null or chain.quotation.details.isEmpty()}" class="empty-state">暂无明细</div>

            <h6 class="mb-2 mt-4">版本历史</h6>
            <table class="table" th:if="${versions != null and !versions.isEmpty()}">
                <thead>
                <tr>
                    <th style="width:100px">版本号</th>
                    <th style="width:180px">生成时间</th>
                    <th>改动说明</th>
                    <th style="width:220px">下载</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${versions}">
                    <td th:text="'v' + ${v.versionNo}">v1</td>
                    <td th:text="${#temporals.format(v.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</td>
                    <td th:text="${v.log} ?: '-'">Automatically generated</td>
                    <td>
                        <a th:href="@{/crm/commercial-invoices/{id}/versions/{versionId}/download(id=${invoice.id}, versionId=${v.id})}"
                           th:text="|${invoice.invoiceNo}-v${v.versionNo}.pdf|">YHINV-2026-001-v1.pdf</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${versions == null or versions.isEmpty()}" class="empty-state">暂无版本</div>
        </div>
    </div>
</div>
</body>
</html>
