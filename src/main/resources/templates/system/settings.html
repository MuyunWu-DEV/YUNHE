<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('系统设置')}"></head>
<body th:replace="~{fragments/layout :: layout('系统设置', ~{::content})}">
<div th:fragment="content">
    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>系统设置</h5>
        </div>
        <div class="card-body">
            <p class="text-muted">维护形式发票默认的 Seller / Terms / Bank Account Information，生成发票时可一键导入。</p>

            <form th:action="@{/system/settings}" th:object="${settingsForm}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label" for="seller">Seller（卖方）</label>
                    <textarea class="form-control" id="seller" th:field="*{seller}" rows="5"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="terms">Terms（条款）</label>
                    <textarea class="form-control" id="terms" th:field="*{terms}" rows="4"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="incoterms">Incoterms（贸易条款）</label>
                    <input type="text" class="form-control" id="incoterms" th:field="*{incoterms}"
                           placeholder="如：FOB QINGDAO PORT"/>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="bankAccountInformation">Bank Account Information（银行账户信息）</label>
                    <textarea class="form-control" id="bankAccountInformation" th:field="*{bankAccountInformation}" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
