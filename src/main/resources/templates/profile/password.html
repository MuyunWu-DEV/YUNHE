<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('修改密码')}"></head>
<body th:replace="~{fragments/layout :: layout('修改密码', ~{::content})}">
<div th:fragment="content">
    <div class="card" style="max-width: 520px;">
        <div class="card-header"><h5>修改密码</h5></div>
        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/admin/profile/password}" th:object="${form}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="oldPassword">原密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="oldPassword" th:field="*{oldPassword}"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('oldPassword')}"
                         th:errors="*{oldPassword}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newPassword">新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}"
                         th:errors="*{newPassword}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirmPassword">确认新密码 <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"/>
                    <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 确认修改</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
