<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('装箱单详情')}"></head>
<body th:replace="~{fragments/layout :: layout('装箱单详情', ~{::content})}">
<div th:fragment="content">
    <div th:if="${chain != null}"
         th:replace="~{fragments/chain :: chainPanel(${chain}, 'packingList')}"></div>

    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5>装箱单详情</h5>
            <div class="d-flex gap-2">
                <form th:if="${packingList.status.name() != 'GENERATED'}" sec:authorize="hasAuthority('packing-list:update')"
                      th:action="@{/crm/packing-lists/{id}/generate(id=${packingList.id})}"
                      method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-sm btn-primary">
                        <i class="bi bi-file-earmark-arrow-down"></i>
                        <span th:text="${packingList.status.name() == 'PENDING_REGENERATION'} ? '重新生成' : '生成 PDF'">生成 PDF</span></button>
                </form>
                <a th:if="${packingList.status.name() == 'PENDING_GENERATION'}"
                   sec:authorize="hasAuthority('packing-list:update')"
                   th:href="@{/crm/packing-lists/{id}/edit(id=${packingList.id})}"
                   class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-pencil"></i> 编辑</a>
                <a th:if="${packingList.status.name() == 'GENERATED'}"
                   sec:authorize="hasAuthority('packing-list:update')"
                   th:href="@{/crm/packing-lists/{id}/revise(id=${packingList.id})}"
                   class="btn btn-sm btn-outline-warning">
                    <i class="bi bi-arrow-repeat"></i> 发起变更</a>
                <a th:href="@{/crm/packing-lists}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-2">装箱单号</dt>
                <dd class="col-sm-4" th:text="${packingList.packingNo}">YHPL-2026-001</dd>
                <dt class="col-sm-2">装箱日期</dt>
                <dd class="col-sm-4" th:text="${packingList.packingDate}">2026-01-01</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">状态</dt>
                <dd class="col-sm-10">
                    <span class="badge badge-soft"
                          th:classappend="${packingList.status.name() == 'GENERATED'} ? 'badge-success' : (${packingList.status.name() == 'PENDING_REGENERATION'} ? 'badge-warning' : 'badge-muted')"
                          th:text="#{${packingList.status.code}}">待生成</span>
                </dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">客户</dt>
                <dd class="col-sm-4"
                    th:text="${packingList.customer != null ? packingList.customer.name + (!#strings.isEmpty(packingList.customer.company) ? ' (' + packingList.customer.company + ')' : '') : '-'}">客户</dd>
                <dt class="col-sm-2">唛头</dt>
                <dd class="col-sm-4" th:text="${packingList.marks} ?: '-'">-</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">件数</dt>
                <dd class="col-sm-2" th:text="${packingList.numberOfPackages} ?: '-'">-</dd>
                <dt class="col-sm-2">毛重</dt>
                <dd class="col-sm-2" th:text="${packingList.grossWeight} ?: '-'">-</dd>
                <dt class="col-sm-2">净重</dt>
                <dd class="col-sm-2" th:text="${packingList.netWeight} ?: '-'">-</dd>
            </dl>
            <dl class="row mb-4">
                <dt class="col-sm-2">体积(m³)</dt>
                <dd class="col-sm-4" th:text="${packingList.volume} ?: '-'">-</dd>
                <dt class="col-sm-2">备注</dt>
                <dd class="col-sm-4" th:text="${packingList.remark} ?: '-'">-</dd>
            </dl>

            <h6 class="mb-3">货物明细</h6>
            <div class="table-responsive" th:if="${packingList.lines != null and !packingList.lines.isEmpty()}">
                <table class="table table-bordered align-middle">
                    <thead>
                    <tr>
                        <th>品名 / HS Code / 描述</th>
                        <th style="width:10%">件数</th>
                        <th style="width:12%">净重(kg)</th>
                        <th style="width:12%">毛重(kg)</th>
                        <th style="width:12%">体积(m³)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="line : ${packingList.lines}">
                        <td>
                            <div th:with="ctx=${plItemByKey != null ? plItemByKey[line.quoteLineKey()] : null}">
                                <div class="fw-bold" th:text="${ctx != null ? ctx.groupName() : (line.quoteLineKey() ?: '-')}">品名</div>
                                <div class="small text-muted" th:if="${ctx != null and ctx.hsCode() != null}" th:text="'HS Code: ' + ${ctx.hsCode()}">HS Code</div>
                                <div class="small" th:if="${ctx != null and ctx.description() != null}" th:text="${ctx.description()}">描述</div>
                            </div>
                        </td>
                        <td th:text="${line.packages() != null ? line.packages() : '-'}">件数</td>
                        <td th:text="${line.netWeight() != null ? #numbers.formatDecimal(line.netWeight(), 1, 0, 3, '.') : '-'}">净重</td>
                        <td th:text="${line.grossWeight() != null ? #numbers.formatDecimal(line.grossWeight(), 1, 0, 3, '.') : '-'}">毛重</td>
                        <td th:text="${line.measurement() != null ? #numbers.formatDecimal(line.measurement(), 1, 0, 3, '.') : '-'}">体积</td>
                    </tr>
                    <tr class="fw-bold table-light">
                        <td>合计 TOTAL</td>
                        <td th:text="${packingList.numberOfPackages()} ?: '-'">件数</td>
                        <td th:text="${packingList.netWeight() != null ? #numbers.formatDecimal(packingList.netWeight(), 1, 0, 3, '.') : '-'}">净重</td>
                        <td th:text="${packingList.grossWeight() != null ? #numbers.formatDecimal(packingList.grossWeight(), 1, 0, 3, '.') : '-'}">毛重</td>
                        <td th:text="${packingList.volume() != null ? #numbers.formatDecimal(packingList.volume(), 1, 0, 3, '.') : '-'}">体积</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div th:if="${packingList.lines == null or packingList.lines.isEmpty()}" class="empty-state">暂无明细</div>

            <h6 class="mb-2 mt-4">版本历史</h6>
            <table class="table" th:if="${versions != null and !versions.isEmpty()}">
                <thead>
                <tr>
                    <th style="width:100px">版本号</th>
                    <th style="width:180px">生成时间</th>
                    <th>改动说明</th>
                    <th style="width:220px">下载</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${versions}">
                    <td th:text="'v' + ${v.versionNo}">v1</td>
                    <td th:text="${#temporals.format(v.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2026-01-01 00:00:00</td>
                    <td th:text="${v.log} ?: '-'">Automatically generated</td>
                    <td>
                        <a th:href="@{/crm/packing-lists/{id}/versions/{versionId}/download(id=${packingList.id}, versionId=${v.id})}"
                           th:text="|${packingList.packingNo}-v${v.versionNo}.pdf|">YHPL-2026-001-v1.pdf</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${versions == null or versions.isEmpty()}" class="empty-state">暂无版本</div>
        </div>
    </div>
</div>
</body>
</html>
