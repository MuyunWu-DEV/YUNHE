<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('编辑装箱单')}"></head>
<body th:replace="~{fragments/layout :: layout('编辑装箱单', ~{::content})}">
<div th:fragment="content">
    <div class="card" style="max-width: 1440px;">
        <div class="card-header">
            <h5 th:text="${isChange} ? '发起变更' : '编辑装箱单'">编辑装箱单</h5>
        </div>
        <div class="card-body">
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="${isChange} ? @{/crm/packing-lists/{id}/revise(id=${packingListForm.id})} : @{/crm/packing-lists/{id}(id=${packingListForm.id})}"
                  th:object="${packingListForm}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label" for="packingDate">装箱日期 <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="packingDate" th:field="*{packingDate}"/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('packingDate')}" th:errors="*{packingDate}"></div>
                    </div>
                </div>

                <h6 class="mb-2">装箱明细（逐项填写，整单合计自动汇总）</h6>
                <div class="table-responsive mb-3" th:if="${packingListForm.lines != null and !packingListForm.lines.isEmpty()}">
                    <table class="table table-bordered align-middle">
                        <thead>
                        <tr>
                            <th style="width:30%">品名 / HS Code / 描述</th>
                            <th style="width:10%">数量(set)</th>
                            <th style="width:12%">件数/(pcs)</th>
                            <th style="width:12%">净重(kg)</th>
                            <th style="width:12%">毛重(kg)</th>
                            <th style="width:12%">体积(m³)</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="line, st : ${packingListForm.lines}">
                            <td>
                                <input type="hidden" th:field="*{lines[__${st.index}__].quoteLineKey}"/>
                                <div th:with="ctx=${plItemByKey[line.quoteLineKey]}">
                                    <div class="fw-bold" th:text="${ctx != null ? ctx.groupName() : (line.quoteLineKey ?: '-')}">品名</div>
                                    <div class="small text-muted" th:if="${ctx != null and ctx.hsCode() != null}" th:text="'HS Code: ' + ${ctx.hsCode()}">HS Code</div>
                                    <div class="small" th:if="${ctx != null and ctx.description() != null}" th:text="${ctx.description()}">描述</div>
                                </div>
                            </td>
                            <td th:if="${plItemByKey[line.quoteLineKey] != null}"
                                th:text="${plItemByKey[line.quoteLineKey].quantity()}">24 SETS</td>
                            <td th:unless="${plItemByKey[line.quoteLineKey] != null}">-</td>
                            <td><input type="number" min="1" step="1" class="form-control" th:field="*{lines[__${st.index}__].packages}"/></td>
                            <td><input type="number" step="any" class="form-control" th:field="*{lines[__${st.index}__].netWeight}"/></td>
                            <td><input type="number" step="any" class="form-control" th:field="*{lines[__${st.index}__].grossWeight}"/></td>
                            <td><input type="number" step="any" class="form-control" th:field="*{lines[__${st.index}__].measurement}"/></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${packingListForm.lines == null or packingListForm.lines.isEmpty()}" class="empty-state mb-3">
                    暂无装箱行（请先由形式发票生成装箱单）
                </div>

                <div class="mb-3">
                    <label class="form-label" for="marks">唛头（Marks）</label>
                    <textarea class="form-control" id="marks" th:field="*{marks}" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="remark">备注</label>
                    <textarea class="form-control" id="remark" th:field="*{remark}" rows="2"></textarea>
                </div>

                <div class="mb-3" th:if="${isChange}">
                    <label class="form-label" for="changeReason">变更原因 <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="changeReason" th:field="*{changeReason}" rows="3"
                              placeholder="说明本次变更原因"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('changeReason')}" th:errors="*{changeReason}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i>
                        <span th:text="${isChange} ? '保存变更' : '保存'">保存</span></button>
                    <a th:href="@{/crm/packing-lists}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
