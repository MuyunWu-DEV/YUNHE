# ============================================================
# YUNHE Website + MySQL 8 — Docker Compose
# 用法：
#   1. 首次/每次部署前：在项目根执行  mvn clean package -DskipTests
#   2. cd deploy && cp .env.example .env  并编辑 .env 里的数据库口令
#   3. docker compose up -d --build
#   访问：http://<ECS公网IP>:8080
# 详见 deploy/README-部署.md
# ============================================================

services:
  # ---------- MySQL 8 数据库 ----------
  db:
    image: mysql:8.0
    container_name: yunhe-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 官方镜像首次启动自动创建同名库(yunhe)与账号，并对该库授权
      MYSQL_DATABASE: yunhe
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - yunhe-net

  # ---------- Spring Boot 应用 ----------
  app:
    build:
      context: ..            # 项目根（含 target/ 的 jar）
      dockerfile: deploy/Dockerfile
    image: yunhe-website:latest
    container_name: yunhe-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/yunhe?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # 首次上线 prod 空库 validate 起不来 → 用 update 让 Hibernate 建表；
      # 表结构稳定后建议改回 validate（防误改线上结构）。见 README。
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-update}
      # 首次部署建管理员：设 seed=1 + initial password 后 up 一次，建完改回（见 README 第6节）
      SPRING_APP_SECURITY_SEED_DEFAULT_ADMIN: ${SEED_ADMIN:-false}
      SPRING_APP_SECURITY_ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    networks:
      - yunhe-net

volumes:
  mysql_data:

networks:
  yunhe-net:
